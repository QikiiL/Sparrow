[package]
name = "sparrow"
version = "1.1.1"
description = "A clipboard manager built with Tauri"
authors = ["you"]
license = "MIT"
edition = "2021"

# 发布构建:链接期优化 + 去符号,减小体积与常驻内存
[profile.release]
lto = "thin"
strip = true

[lib]
name = "clipboard_manager_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png:托盘专用图标以 include_bytes! 打包 PNG,需要 tauri 的
# Image::from_bytes 解码能力(image 0.25 本就是本包直接依赖,不新增依赖)
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
enigo = { version = "0.2" }
arboard = "3"
image = "0.25"
clipboard-win = "5"
base64 = "0.22"
# 云同步(WebDAV / S3):端到端加密 + 对象存储适配。
# 全部纯 Rust 实现,不引系统库:keyring 走 Windows 原生 Credential Manager
# (windows-native feature),aes-gcm/argon2 均为 RustCrypto 实现。
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
quick-xml = "0.39"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# WebDAV / S3 后端的 URL 拼装与 SigV4 规范化(ureq 已传递依赖 url,这里只是直接引用)
url = "2"
winreg = "0.52"
regex = "1"
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  # 短信验证码捕获:读 Windows 通知中心(TeleLink 同款路径)。
  # WinRT 类 API 无法用裸 #[link] 声明绕过,只能走 feature;
  # 范围已压到最小(通知监听 + 通知内容 + 通知来源 App 信息 + 集合迭代
  # + Foundation:TypedEventHandler,用于订阅 NotificationChanged 事件)
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  # 稀疏 MSIX 包身份:运行时用 PackageManager 注册稀疏包,让进程获得包身份
  # 从而能订阅 NotificationChanged(无身份必报 0x80070490)。需要
  # Deployment API(FindPackagesByNamePublisher / AddPackageByUriAsync)。
  # Win32_System_Com 供探针 bin 以 STA 初始化 COM(RequestAccessAsync
  # 官方要求 UI 线程/STA 调用,MTA 下恒返回 Denied)
  "Management_Deployment",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
# WebDAV / S3 后端测试用本地 HTTP mock(不需要外网,也不碰真实存储)
httpmock = "0.7"
